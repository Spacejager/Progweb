<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>2173021 Morley Tri Wahyudin Soal 4</title>
    <script src="jquery-4.0.0.min.js"></script>
    
    <style>
        table {
            margin: 20px;
        }
        td {
            padding: 5px;
        }
        hr {
            margin: 5px 0;
            border: 1px solid #000;
        }
    </style>
</head>
<body>

    <table border="1" cellpadding="0" cellspacing="0">
        <tr>
            <td width="50" align="center">
                <input class="header" type="checkbox"/><br/>
                <hr/>
                <input class="body" type="checkbox"/><br/>
                <input class="body" type="checkbox"/><br/>
                <input class="body" type="checkbox"/><br/>
                <input class="body" type="checkbox"/><br/>
                <input class="body" type="checkbox"/><br/>
            </td>
        </tr>
    </table>

    <script>
        $(document).ready(function() {
            $("input:checkbox.header").click(function() {
                var flag = $(this).attr("checked"); 
                if (flag) {
                    $("input:checkbox.body").attr("checked", "checked");
                } else {
                    $("input:checkbox.body").removeAttr("checked");
                }
                
            });

        });
    </script>

</body>
</html>

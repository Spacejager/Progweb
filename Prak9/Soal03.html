<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>2173021 Morley Tri Wahyudin Soal 3</title>
    
    <script src="jquery-4.0.0.min.js"></script>
    
    <style>
        div.kotak { 
            width: 40px; 
            height: 40px; 
            margin: 5px; 
            float: left;
            border: 2px blue solid; 
            text-align: center; 
            background-color: white; 
        }
        
        span { 
            color: red; 
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        button {
            margin: 5px;
            margin-bottom: 10px;
        }
    </style>

    <script src="jquery.js"></script>
</head>
<body>

    <button>Change colors</button>
    
    <div class="clearfix">
        <div class="kotak"></div>
        <div class="kotak"></div>
        <div class="kotak"></div>
        <div class="kotak"></div>
        <div class="kotak"></div>
        <div class="kotak"></div>
        <div class="kotak"></div>
        <div class="kotak"></div>
    </div>

    <script>
        $(document).ready(function() {

            //Fungsi kotak diklik
            $("div.kotak").click(function() {
                $(this).css("background-color", "red");
                $(this).attr("id", "batasMerah");
            });

            //Fungsi saat tombol "Change colors" diklik
            $("button").click(function () {
                $("div.kotak").each(function (index, domEle) {
        
                    if ($(domEle).attr("id") === "batasMerah") {

                        return false; 
                    } else {
                        $(domEle).css("background-color", "yellow");
                    }
                    
                });
            });

        });
    </script>

</body>
</html>
